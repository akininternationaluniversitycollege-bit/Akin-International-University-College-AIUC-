<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courses - Akin University</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <header class="bg-[#0A2E5C] text-white p-4">
    <h1 class="text-xl font-bold">Available Courses</h1>
  </header>
  <main class="container mx-auto px-4 py-8">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white p-4 rounded shadow">
        <h2 class="text-xl font-bold text-[#0A2E5C]">Computer Science</h2>
        <ul class="list-disc pl-5 text-gray-700">
          <li>Introduction to Programming</li>
          <li>Data Structures & Algorithms</li>
          <li>Web Development</li>
        </ul>
      </div>
      <div class="bg-white p-4 rounded shadow">
        <h2 class="text-xl font-bold text-[#0A2E5C]">Business Administration</h2>
        <ul class="list-disc pl-5 text-gray-700">
          <li>Principles of Management</li>
          <li>Marketing Fundamentals</li>
          <li>Financial Accounting</li>
        </ul>
      </div>
    </div>
  </main>
  <footer class="bg-gray-800 text-white py-4 text-center text-sm">
    <p>&copy; 2024 Akin International University College</p>
  </footer>
</body>
</html>
