<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us - Akin University</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <header class="bg-[#0A2E5C] text-white p-4">
    <h1 class="text-xl font-bold">Contact Us</h1>
  </header>
  <main class="container mx-auto px-4 py-8">
    <form class="max-w-md mx-auto bg-white p-6 rounded shadow">
      <div class="mb-4">
        <label class="block text-gray-700">Name</label>
        <input type="text" class="w-full p-2 border rounded">
      </div>
      <div class="mb-4">
        <label class="block text-gray-700">Email</label>
        <input type="email" class="w-full p-2 border rounded">
      </div>
      <div class="mb-4">
        <label class="block text-gray-700">Message</label>
        <textarea class="w-full p-2 border rounded" rows="4"></textarea>
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded">Send Message</button>
    </form>
  </main>
  <footer class="bg-gray-800 text-white py-4 text-center text-sm">
    <p>&copy; 2024 Akin International University College</p>
  </footer>
</body>
</html>
